version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ecgqi_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecgqi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecgqi_password}
      POSTGRES_DB: ${POSTGRES_DB:-ecgqi_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecgqi_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecgqi_network

  # Backend (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecgqi_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecgqi_user}:${POSTGRES_PASSWORD:-ecgqi_password}@postgres:5432/${POSTGRES_DB:-ecgqi_db}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ENV: ${ENV:-development}
      DEBUG: ${DEBUG:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecgqi_network
    command: >
      sh -c "alembic upgrade head &&
             python -m scripts.seed_data &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecgqi_frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - ecgqi_network
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  postgres_data:
  backend_uploads:

networks:
  ecgqi_network:
    driver: bridge
